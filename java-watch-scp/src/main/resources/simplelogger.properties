# SLF4J Simple Logger Configuration

# Default log level for all loggers
org.slf4j.simpleLogger.defaultLogLevel=info

# Show date/time in logs
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# Show thread name
org.slf4j.simpleLogger.showThreadName=false

# Show logger name
org.slf4j.simpleLogger.showLogName=true

# Show short logger name
org.slf4j.simpleLogger.showShortLogName=false

# Log level for our application (set to debug for more verbose output)
org.slf4j.simpleLogger.log.hr.hrg.watch2.scp=info

# Uncomment to enable debug logging for file watcher
#org.slf4j.simpleLogger.log.hr.hrg.watch2.scp.WatchScpApp=debug

# Uncomment to enable debug logging for SCP transfers
#org.slf4j.simpleLogger.log.hr.hrg.watch2.scp.ScpTransfer=debug
