<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dependency cycles</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --fg:#1c1c1a; --muted:#6d6b66; --line:#e2e0da; --accent:#2f6feb; --bad:#b42318; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1320px; margin: 30px auto; padding: 0 22px; }
  h1 { font-size: 27px; margin: 0 0 4px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .refresh { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 7px; padding: 7px 11px; cursor: pointer; }
  .refresh:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .refresh:disabled { opacity: .55; cursor: default; }
  .refresh.attention { border-color: #d97706; color: #92400e; background: #fffbeb; animation: refresh-pulse 1.8s ease-in-out infinite; }
  @keyframes refresh-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(217,119,6,0); } 50% { box-shadow: 0 0 0 4px rgba(217,119,6,.22); } }
  h2 { font-size: 18px; margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 18px; }
  .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 11px 14px; }
  .card b { display: block; font-size: 22px; } .card span { color: var(--muted); font-size: 12px; }
  .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 13px; }
  input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; margin-bottom: 10px; }
  .cycle-list { max-height: 62vh; overflow: auto; display: grid; gap: 5px; }
  .cycle { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 7px 9px; cursor: pointer; }
  .cycle.selected { border-color: var(--accent); background: #f2f7ff; } .cycle b { font-size: 13px; }
  .cycle small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--muted); }
  .cycle-node { padding: 5px 0; border-bottom: 1px solid #f0efea; overflow-wrap: anywhere; }
  .cycle-node:last-child { border-bottom: 0; }
  .cycle-node a { color: var(--accent); text-decoration: none; }
  .cycle-node a:hover { text-decoration: underline; }
  .kind { color: var(--muted); font-size: 12px; }
  .hubs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .hub { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid #f0efea; }
  .hub:last-child { border-bottom: 0; } .hub b { color: var(--bad); }
  .error { color: var(--bad); }
  @media (max-width: 800px) { .layout, .summary, .hubs { grid-template-columns: 1fr; } .cycle-list { max-height: 38vh; } }
</style>
</head>
<body>
<div id="page"></div>
<script>window.CYCLES_INDEXES = __INDEXES__; window.CYCLES_TITLE = __TITLE__;</script>
<script type="module" src="__BUNDLE__"></script>
</body>
</html>
