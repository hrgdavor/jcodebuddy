<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>merge-java resolution report</title>
    <style>
      :root {
        --bg: #fbfbfa;
        --fg: #1b1b1a;
        --muted: #6b6a67;
        --line: #e2e0dc;
        --card: #ffffff;
        --auto: #1a7f37;
        --review: #9a6700;
        --manual: #b42318;
        --code-bg: #f6f6f4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 28px 64px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }
      h1 { font-size: 20px; margin: 0 0 4px; }
      h2 { font-size: 16px; margin: 28px 0 8px; }
      h3 { font-size: 14px; margin: 0 0 6px; }
      .source { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
      .source code { font-size: 12px; }
      .badge {
        display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px;
        border: 1px solid var(--line); background: #fff; color: var(--muted); vertical-align: 2px;
      }
      .badge.sample { border-color: #f0c36d; background: #fff8e6; color: #7a5300; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0; }
      .chip {
        border: 1px solid var(--line); background: var(--card); border-radius: 8px;
        padding: 6px 10px; min-width: 92px;
      }
      .chip .k { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
      .chip .v { font-size: 17px; font-weight: 600; }
      .file { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
      .file .path { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }
      .file .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .card {
        background: var(--card); border: 1px solid var(--line); border-left-width: 3px;
        border-radius: 10px; padding: 12px 14px; margin: 12px 0;
      }
      .card.AUTO { border-left-color: var(--auto); }
      .card.REVIEW { border-left-color: var(--review); }
      .card.MANUAL { border-left-color: var(--manual); }
      .card .top { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
      .card .top .type { font-weight: 600; }
      .card .top .tail { color: var(--muted); font-size: 12px; }
      .sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
      .side .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 3px; }
      pre {
        margin: 0; padding: 8px 10px; background: var(--code-bg); border: 1px solid var(--line);
        border-radius: 6px; overflow-x: auto; font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
        white-space: pre-wrap; word-break: break-word;
      }
      .side.resolved pre { background: #f2f8f3; border-color: #cfe6d4; }
      .note { color: var(--muted); font-size: 12px; margin-top: 8px; font-style: italic; }
      .explanation { margin-top: 8px; }
      ul.warnings, ul.options { margin: 6px 0 0; padding-left: 20px; }
      ul.warnings li { color: var(--manual); }
      .fixpath { margin-top: 10px; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; }
      .fixpath .desc { font-weight: 600; }
      .fixpath .kv { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .fixpath .kv b { color: var(--fg); font-weight: 600; }
      .conflicts { margin-top: 10px; font-size: 12px; color: var(--muted); }
      .conflicts code { font-family: ui-monospace, Consolas, monospace; }
      .exportbar {
        display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0 4px;
        padding: 9px 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px;
      }
      button {
        font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px;
        background: #fff; color: var(--fg); cursor: pointer;
      }
      button:hover:not(:disabled) { border-color: var(--muted); }
      button:disabled { opacity: .45; cursor: default; }
      .actions {
        margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
        background: #fcfcfa;
      }
      .actions select, .actions textarea {
        display: block; width: 100%; margin: 6px 0; font: inherit; padding: 6px 8px;
        border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--fg);
      }
      .actions textarea { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; }
      .actions.accepted { background: #f2f8f2; border-color: #bcd9bc; }
      .actions .badge { margin-left: 6px; }
      .block {
        margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line); border-left: 3px solid #d8d8d0;
        border-radius: 8px; background: #fff;
      }
      .block.needs-you { border-left-color: #d9a640; background: #fffdf6; }
      .block.several { border-left-color: #c96f6f; }
      .blockhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; }
      .blocktitle { font-weight: 600; }
      .blockstate { margin-left: auto; color: var(--muted); font-size: 12px; }
      .blocknote { margin: 4px 0 2px; color: var(--muted); font-size: 12px; }
      .actions .label {
        color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em;
      }
      /* The multi-file flow (plan step 4.13, deliverable 4): the file list beside the open file. */
      .run { display: grid; grid-template-columns: minmax(220px, 320px) 1fr; gap: 18px; margin-top: 16px; }
      .filelist h2 { font-size: 14px; margin: 0 0 8px; }
      .filelist ul { list-style: none; margin: 0; padding: 0; }
      .filestate {
        display: block; width: 100%; text-align: left; margin-bottom: 4px; padding: 6px 8px;
        border: 1px solid var(--line); border-left-width: 3px; border-radius: 5px;
        background: transparent; color: inherit; font: inherit; cursor: pointer;
      }
      .filestate:hover { background: #f6f8fc; }
      .filestate.current { border-color: #2f6feb; background: #eef2ff; }
      .filestate.done { border-left-color: #4a9d5f; }
      .filename {
        display: block; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px;
        overflow-wrap: anywhere;
      }
      .filecounts { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
      .filecounts .open { color: #b4541f; }
      .filecounts .none { color: #4a9d5f; }
      .runhead { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
      .blockactions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
      .blockactions button { font: inherit; padding: 3px 9px; border-radius: 5px; border: 1px solid var(--line); cursor: pointer; }
      .acceptblock { border-color: #2f6feb; }
      .blocked { color: var(--muted); font-size: 12px; font-style: italic; }
      /* One click to open the set, one to apply it: what makes taking suggestions acceptable. */
      .confirm { flex-basis: 100%; border: 1px solid #2f6feb; border-radius: 6px; padding: 8px 10px; background: #f7f9ff; }
      .confirmhead { font-weight: 600; margin-bottom: 4px; }
      .confirm ul { margin: 0 0 6px; padding-left: 18px; color: var(--muted); font-size: 12px; }
      .confirmtype { font-family: ui-monospace, Consolas, monospace; }
      .confirmbuttons { display: flex; gap: 8px; }
      .confirmyes { border-color: #2f6feb; font-weight: 600; }
      .export-outcome { color: var(--muted); font-size: 12px; flex-basis: 100%; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./review.js"></script>
  </body>
</html>
